<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Modelo 3D AR</title>

  <script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #f5f5f5;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
 
  <model-viewer
     src="Jeros.glb"
     ar
     ar-modes="webxr scene-viewer quick-look"
     camera-controls
     auto-rotate>
  </model-viewer>

</body>
</html>
